<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>사고이력 브리핑 입력 · 카히스토리</title><link rel="stylesheet" href="resources/briefing.css"></head><body><main>
<div class="top"><div class="eyebrow">카히스토리 · AI 사고이력 브리핑</div><a href="sample.html">기존 카히스토리 화면</a></div>
<section class="frame form"><h1><span class="spark" aria-hidden="true">✧</span>수리내역으로 사고이력 브리핑 만들기</h1>
<p class="context">차량 정보와 보험사고 수리항목을 입력하면 Gemma 4가 충격 방향, 피해 규모, 사고 유형과 근거를 분석합니다.</p>
<form id="briefing-form"><div class="row"><div class="field"><label for="vehicle">차량명</label><input id="vehicle" name="vehicleName" placeholder="예: BMW X6 xDrive30d" autocomplete="off"></div><div class="field"><label for="date">사고일자 (선택)</label><input id="date" name="accidentDate" type="date"></div></div>
<div class="field"><label for="report-file">수리내역 TXT 파일 (선택)</label><input id="report-file" type="file" accept=".txt,text/plain"><p class="hint">첨부한 6건과 같은 한 줄당 한 항목 형식의 TXT 파일을 불러올 수 있습니다.</p></div>
<div class="field"><label for="history">보험사고 수리내역</label><textarea id="history" name="repairHistory" required placeholder="수리항목을 한 줄에 하나씩 입력하세요.&#10;예: 프런트범퍼커버(교환)&#10;예: 프런트범퍼 (도장)"></textarea><p class="hint">한 줄이 하나의 근거(R001, R002…)가 됩니다. 수리항목 원문을 그대로 붙여 넣으세요. 최대 300줄입니다.</p></div>
<div class="actions"><button id="submit" type="submit">Gemma 4로 분석하기</button><span id="status" class="muted" role="status" aria-live="polite"></span></div><p id="error" class="error" role="alert"></p></form>
<p class="foot">AI 결과는 수리내역을 바탕으로 한 추정입니다. 전문가 검토 전 결과는 자동 게시 대상이 아닙니다.</p></section>
</main><script>
const form=document.getElementById('briefing-form'),button=document.getElementById('submit'),status=document.getElementById('status'),error=document.getElementById('error');
document.getElementById('report-file').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;document.getElementById('history').value=await file.text();if(!document.getElementById('vehicle').value)document.getElementById('vehicle').value=file.name.replace(/\.txt$/i,'').replace(/\s+\S*\d{4}$/,'');});
form.addEventListener('submit',async event=>{event.preventDefault();error.textContent='';button.disabled=true;button.textContent='분석 중…';status.textContent='수리항목 표준화 후 Gemma 4가 판단·검토하고 있습니다. 잠시 기다려 주세요.';try{const data=Object.fromEntries(new FormData(form).entries());const response=await fetch('api/briefings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw new Error(result.error||'분석 요청에 실패했습니다.');location.href='briefing-result.html?id='+encodeURIComponent(result.accident_id)}catch(ex){error.textContent=ex.message;status.textContent='';button.disabled=false;button.textContent='Gemma 4로 분석하기'}});
</script></body></html>
