<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 사고이력 브리핑 결과 · 카히스토리</title><link rel="stylesheet" href="resources/briefing.css"></head><body><main>
<div class="top"><div class="eyebrow">카히스토리 · 사고이력 브리핑 결과</div><a href="briefing.html">다른 차량 분석하기</a></div>
<p id="context" class="context"></p><div id="audit" class="audit" hidden></div>
<div id="loading" class="loading" role="status">결과를 불러오는 중입니다…</div><p id="error" class="error" role="alert"></p>
<section id="result" class="frame" aria-labelledby="title" hidden><h1 id="title"><span class="spark" aria-hidden="true">✧</span>AI 사고 분석</h1>
<div class="stats"><div class="stat"><div class="icon" aria-hidden="true">▣</div><div><div class="value" id="direction"></div><div class="label">추정 충격 방향</div></div></div><div class="stat"><div class="icon" aria-hidden="true">△</div><div><div class="value" id="scope"></div><div class="label">추정 피해 규모</div></div></div><div class="stat"><div class="icon" aria-hidden="true">▤</div><div><div class="value" id="type"></div><div class="label">가능성 높은 사고 유형</div></div></div></div>
<div class="summary"><h2>종합 분석 요약</h2><p id="summary"></p></div><div class="findings"><h2>주요 부위 및 판단 근거</h2><ol id="findings"></ol></div>
<p class="foot">충격 방향·피해 규모·사고 유형은 수리내역을 바탕으로 한 AI 추정입니다. 전문가 검토 전 결과이며 현재 차량 상태의 확정 판단은 포함하지 않습니다.</p></section>
<details id="details" class="details" hidden><summary>결과 구조 · 실제 JSON · 근거 원문 확인</summary><p id="meta" class="meta"></p><div id="sources"></div><h3>입력 원문과 표준화 결과</h3><div id="all-sources" class="source-grid"></div><h3>분석 결과 JSON</h3><pre id="json" class="json"></pre></details>
</main><script>
const byId=id=>document.getElementById(id),set=(id,value)=>byId(id).textContent=value;
function render(r){const a=r.analysis;set('context','표시 중인 결과: '+r.vehicle_name+' · '+(r.accident_date||'사고일자 미입력')+' · Gemma 4 실제 호출 결과');set('audit','형식·근거 번호 검사 통과 · 전문가 내용 검토 필요 · 자동 게시 대상 아님');byId('audit').hidden=false;set('direction',r.display_labels.impact_direction);set('scope',r.display_labels.damage_scope);set('type',r.display_labels.accident_type);set('summary',a.summary);const list=byId('findings');list.replaceChildren();a.findings.forEach(f=>{const li=document.createElement('li'),body=document.createElement('div'),title=document.createElement('span');title.className='finding-title';title.textContent=f.title+': ';body.append(title,document.createTextNode(f.description));li.append(body);list.append(li)});set('meta','수리항목 '+r.features.repair_count+'건 · 표준화 매핑 '+r.features.mapped_count+'건 · 미매핑 '+r.features.unmapped_ids.length+'건');const sources=byId('sources');sources.replaceChildren();a.findings.forEach((f,i)=>{const detail=document.createElement('details'),heading=document.createElement('summary'),ul=document.createElement('ul');detail.className='source';heading.textContent=(i+1)+'. '+f.title+' — 원문 근거';f.evidence_ids.forEach(id=>{const li=document.createElement('li');li.textContent=id+' · '+(r.source_items[id]||'원문 없음');ul.append(li)});detail.append(heading,ul);sources.append(detail)});const grid=byId('all-sources');grid.replaceChildren();r.normalized_items.forEach(item=>{const id=item[0];[id,r.source_items[id],item[1]+' · '+item[2]].forEach((value,index)=>{const cell=document.createElement('div');cell.textContent=value;if(index===2)cell.className='normalized';grid.append(cell)})});set('json',JSON.stringify(r,null,2));byId('result').hidden=false;byId('details').hidden=false}
(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id){byId('loading').hidden=true;set('error','결과 ID가 없습니다. 입력 화면에서 새로 분석해 주세요.');return}try{const response=await fetch('api/briefings/'+encodeURIComponent(id));const data=await response.json();if(!response.ok)throw new Error(data.error||'결과를 찾을 수 없습니다.');render(data)}catch(ex){set('error',ex.message)}finally{byId('loading').hidden=true}})();
</script></body></html>
